<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stale search results</title><style>body{font:16px system-ui;color:#142c26;background:#f7faf8;margin:0}main{max-width:680px;padding:24px;margin:auto}label,output{display:block;margin:8px 0}button,input,select,textarea{font:inherit;padding:8px;margin:4px 4px 4px 0;max-width:100%;box-sizing:border-box}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #126e55;outline-offset:2px}button{background:#e6f0eb;border:1px solid #456c5c;border-radius:5px}button:disabled{opacity:.5}[role=dialog]{border:1px solid #456c5c;padding:16px}</style><main><h1>Stale search results</h1><label for="q">Search records</label><input id="q"><button id="go">Search</button><output id="status" role="status"></output><p id="result"></p></main><script>{const field=document.getElementById("q"),go=document.getElementById("go"),out=document.getElementById("status"),result=document.getElementById("result");let seq=0,state={query:"",result:""};go.onclick=()=>{let q=field.value,n=++seq;state.query=q;out.textContent="Searching "+q;setTimeout(()=>{ state.result=q;result.textContent=q;out.textContent="Results for "+q},q==="alpha"?180:30)};window.readState=()=>state;}</script></html>
