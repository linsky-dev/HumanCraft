<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Permission changes after preview</title><style>body{font:16px system-ui;color:#142c26;background:#f7faf8;margin:0}main{max-width:680px;padding:24px;margin:auto}label,output{display:block;margin:8px 0}button,input,select,textarea{font:inherit;padding:8px;margin:4px 4px 4px 0;max-width:100%;box-sizing:border-box}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #126e55;outline-offset:2px}button{background:#e6f0eb;border:1px solid #456c5c;border-radius:5px}button:disabled{opacity:.5}[role=dialog]{border:1px solid #456c5c;padding:16px}</style><main><h1>Permission changes after preview</h1><button id="preview">Preview</button><button id="publish" disabled>Publish</button><button id="revoke">Revoke access</button><output id="status" role="status"></output></main><script>{const preview=document.getElementById("preview"),publish=document.getElementById("publish"),revoke=document.getElementById("revoke"),out=document.getElementById("status");let state={published:false,allowed:true};preview.onclick=()=>{publish.disabled=false;out.textContent="Preview ready"};revoke.onclick=()=>{state.allowed=false;out.textContent="Access revoked"};publish.onclick=()=>{ state.published=true;out.textContent="Published"};window.readState=()=>state;}</script></html>
