<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recover a mistakenly removed item</title><style>body{font:16px system-ui;color:#142c26;background:#f7faf8;margin:0}main{max-width:680px;padding:24px;margin:auto}label,output{display:block;margin:8px 0}button,input,select,textarea{font:inherit;padding:8px;margin:4px 4px 4px 0;max-width:100%;box-sizing:border-box}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #126e55;outline-offset:2px}button{background:#e6f0eb;border:1px solid #456c5c;border-radius:5px}button:disabled{opacity:.5}[role=dialog]{border:1px solid #456c5c;padding:16px}</style><main><h1>Recover a mistakenly removed item</h1><p id="items">A, B</p><button id="remove">Remove A</button><button id="undo" disabled>Undo removal</button><output id="status" role="status"></output></main><script>{const items=document.getElementById("items"),remove=document.getElementById("remove"),undo=document.getElementById("undo"),out=document.getElementById("status");let state={items:["A","B"]};function draw(){items.textContent=state.items.join(", ");remove.disabled=!state.items.includes("A")}remove.onclick=()=>{state.items=state.items.filter(x=>x!=="A");undo.disabled=false;draw();out.textContent="A removed"};undo.onclick=()=>{ undo.disabled=true;draw();out.textContent="A restored"};window.readState=()=>state;}</script></html>
