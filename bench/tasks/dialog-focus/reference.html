<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keyboard exit and focus restoration</title><style>body{font:16px system-ui;color:#142c26;background:#f7faf8;margin:0}main{max-width:680px;padding:24px;margin:auto}label,output{display:block;margin:8px 0}button,input,select,textarea{font:inherit;padding:8px;margin:4px 4px 4px 0;max-width:100%;box-sizing:border-box}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #126e55;outline-offset:2px}button{background:#e6f0eb;border:1px solid #456c5c;border-radius:5px}button:disabled{opacity:.5}[role=dialog]{border:1px solid #456c5c;padding:16px}</style><main><h1>Keyboard exit and focus restoration</h1><button id="open">Open details</button><div id="panel" hidden role="dialog" aria-label="Record details"><p>Record A details</p><button id="close">Close details</button></div><output id="status" role="status"></output></main><script>{const openBtn=document.getElementById("open"),panel=document.getElementById("panel"),closeBtn=document.getElementById("close"),out=document.getElementById("status");let state={open:false};function hide(){state.open=false;panel.hidden=true;out.textContent="Closed";openBtn.focus();}openBtn.onclick=()=>{state.open=true;panel.hidden=false;out.textContent="Opened";closeBtn.focus();};closeBtn.onclick=hide;document.addEventListener("keydown",e=>{if(e.key==="Escape"&&state.open)hide()}); window.readState=()=>state;}</script></html>
