<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Approval cannot silently change target</title><style>body{font:16px system-ui;color:#142c26;background:#f7faf8;margin:0}main{max-width:680px;padding:24px;margin:auto}label,output{display:block;margin:8px 0}button,input,select,textarea{font:inherit;padding:8px;margin:4px 4px 4px 0;max-width:100%;box-sizing:border-box}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #126e55;outline-offset:2px}button{background:#e6f0eb;border:1px solid #456c5c;border-radius:5px}button:disabled{opacity:.5}[role=dialog]{border:1px solid #456c5c;padding:16px}</style><main><h1>Approval cannot silently change target</h1><label for="target">Target</label><select id="target"><option>A</option><option>B</option></select><button id="review">Review</button><button id="execute" disabled>Execute</button><output id="status" role="status"></output></main><script>{const target=document.getElementById("target"),review=document.getElementById("review"),execute=document.getElementById("execute"),out=document.getElementById("status");let reviewed=null,state={applied:[],target:"A"};target.onchange=()=>{state.target=target.value;reviewed=null;execute.disabled=true;out.textContent="Review required for "+target.value};review.onclick=()=>{reviewed=target.value;execute.disabled=false;out.textContent="Reviewed "+reviewed};execute.onclick=()=>{if(!reviewed)return;state.applied.push(target.value);out.textContent="Executed "+target.value;reviewed=null;execute.disabled=true};window.readState=()=>state;}</script></html>
