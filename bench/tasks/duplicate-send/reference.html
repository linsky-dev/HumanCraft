<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prevent duplicate submission</title><style>body{font:16px system-ui;color:#142c26;background:#f7faf8;margin:0}main{max-width:680px;padding:24px;margin:auto}label,output{display:block;margin:8px 0}button,input,select,textarea{font:inherit;padding:8px;margin:4px 4px 4px 0;max-width:100%;box-sizing:border-box}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #126e55;outline-offset:2px}button{background:#e6f0eb;border:1px solid #456c5c;border-radius:5px}button:disabled{opacity:.5}[role=dialog]{border:1px solid #456c5c;padding:16px}</style><main><h1>Prevent duplicate submission</h1><button id="send">Send request</button><output id="status" role="status"></output></main><script>{const send=document.getElementById("send"),out=document.getElementById("status");let state={sent:0,pending:false};send.onclick=()=>{if(state.pending)return;send.disabled=true; state.pending=true;out.textContent="Sending";setTimeout(()=>{state.sent++;state.pending=false;out.textContent="Request sent";send.disabled=false},300)};window.readState=()=>state;}</script></html>
