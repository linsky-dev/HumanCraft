<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recover from an empty filter</title><style>body{font:16px system-ui;color:#142c26;background:#f7faf8;margin:0}main{max-width:680px;padding:24px;margin:auto}label,output{display:block;margin:8px 0}button,input,select,textarea{font:inherit;padding:8px;margin:4px 4px 4px 0;max-width:100%;box-sizing:border-box}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #126e55;outline-offset:2px}button{background:#e6f0eb;border:1px solid #456c5c;border-radius:5px}button:disabled{opacity:.5}[role=dialog]{border:1px solid #456c5c;padding:16px}</style><main><h1>Recover from an empty filter</h1><label for="filter">Filter records</label><input id="filter"><button id="clear">Clear filter</button><ul id="items"></ul><output id="status" role="status"></output></main><script>{const filter=document.getElementById("filter"),clear=document.getElementById("clear"),items=document.getElementById("items"),out=document.getElementById("status");let all=["Alpha","Beta"],state={filter:"",items:[]};function draw(){state.filter=filter.value;state.items=all.filter(x=>x.toLowerCase().includes(state.filter.toLowerCase()));items.replaceChildren(...state.items.map(x=>{let l=document.createElement("li");l.textContent=x;return l}));out.textContent=state.items.length?state.items.length+" records":"No results";}filter.oninput=draw;clear.onclick=()=>{filter.value=""; draw()};draw();window.readState=()=>state;}</script></html>
