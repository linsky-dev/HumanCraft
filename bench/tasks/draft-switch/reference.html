<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Switch records without losing notes</title><style>body{font:16px system-ui;color:#142c26;background:#f7faf8;margin:0}main{max-width:680px;padding:24px;margin:auto}label,output{display:block;margin:8px 0}button,input,select,textarea{font:inherit;padding:8px;margin:4px 4px 4px 0;max-width:100%;box-sizing:border-box}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #126e55;outline-offset:2px}button{background:#e6f0eb;border:1px solid #456c5c;border-radius:5px}button:disabled{opacity:.5}[role=dialog]{border:1px solid #456c5c;padding:16px}</style><main><h1>Switch records without losing notes</h1><label for="record">Record</label><select id="record"><option>A</option><option>B</option></select><label for="note">Note</label><textarea id="note"></textarea><output id="status" role="status"></output></main><script>{const record=document.getElementById("record"),note=document.getElementById("note"),out=document.getElementById("status");let state={active:"A",notes:{A:"",B:""}};note.oninput=()=>{state.notes[state.active]=note.value;out.textContent="Draft retained"};record.onchange=()=>{ state.active=record.value;note.value=state.notes[state.active]};window.readState=()=>state;}</script></html>
